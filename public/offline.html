<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0D47A1">
    <title>Offline — SMART-DTR</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Segoe UI", system-ui, sans-serif;
            background: #F5F7FA;
            color: #263238;
            padding: 24px;
            text-align: center;
        }
        .card {
            max-width: 360px;
            background: #fff;
            border-radius: 16px;
            padding: 28px 24px;
            border: 1px solid rgba(13, 71, 161, 0.12);
            box-shadow: 0 10px 30px rgba(13, 71, 161, 0.08);
        }
        h1 { margin: 0 0 8px; font-size: 1.25rem; color: #0D47A1; }
        p { margin: 0 0 20px; color: #546E7A; line-height: 1.5; font-size: 0.95rem; }
        button {
            appearance: none;
            border: 0;
            background: #0D47A1;
            color: #fff;
            font-weight: 600;
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>You are offline</h1>
        <p>SMART-DTR needs an internet connection for attendance, leave, and HR tools. Reconnect, then try again.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </div>
</body>
</html>
